name: release
on:
  push:
    tags:
      - 'v*'
    branches:
      - fix/compile-errors
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq 'tag') {
            $v = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $v = ((Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value)
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "version $v"

      - name: Kernel tests
        shell: pwsh
        run: |
          cargo test --locked --all-targets --no-fail-fast 2>&1 | Tee-Object -FilePath kernel-test.log
          if ($LASTEXITCODE -ne 0) {
            $errs = (Select-String -Path kernel-test.log -Pattern '^error|error\[|FAILED|panicked|^failures:|LNK[0-9]+' | Select-Object -First 25 | ForEach-Object { $_.Line }) -join "`n"
            $tail = (Get-Content kernel-test.log -Tail 40) -join "`n"
            foreach ($m in @($errs, $tail)) { Write-Host ("::error title=kernel tests::" + (($m -replace '%','%25' -replace "`r",'') -replace "`n",'%0A')) }
            exit 1
          }

      - name: GUI tests
        shell: pwsh
        run: |
          cargo test --locked --manifest-path ui-prototype/Cargo.toml --no-default-features --features kernel --no-fail-fast 2>&1 | Tee-Object -FilePath gui-test.log
          if ($LASTEXITCODE -ne 0) {
            $errs = (Select-String -Path gui-test.log -Pattern '^error|error\[|FAILED|panicked|^failures:|LNK[0-9]+' | Select-Object -First 25 | ForEach-Object { $_.Line }) -join "`n"
            $tail = (Get-Content gui-test.log -Tail 40) -join "`n"
            foreach ($m in @($errs, $tail)) { Write-Host ("::error title=gui tests::" + (($m -replace '%','%25' -replace "`r",'') -replace "`n",'%0A')) }
            exit 1
          }

      - name: Build release binaries
        shell: pwsh
        run: |
          cargo build --release --locked --bin ladon 2>&1 | Tee-Object -FilePath build-kernel.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build-kernel.log -Tail 40) -join "`n"
            Write-Host ("::error title=kernel build::" + (($tail -replace '%','%25' -replace "`r",'') -replace "`n",'%0A'))
            exit 1
          }
          cargo build --release --locked --manifest-path ui-prototype/Cargo.toml --bin ladon-gui 2>&1 | Tee-Object -FilePath build-gui.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build-gui.log -Tail 40) -join "`n"
            Write-Host ("::error title=gui build::" + (($tail -replace '%','%25' -replace "`r",'') -replace "`n",'%0A'))
            exit 1
          }

      - name: Assemble package folder and zip
        shell: pwsh
        run: |
          try {
            ./packaging/windows/Build-Package.ps1 `
              -Binary "target/release/ladon.exe" `
              -GuiBinary "ui-prototype/target/release/ladon-gui.exe" `
              -OutDir "dist" `
              -Version "$env:VERSION" *>&1 | Tee-Object -FilePath package.log
          } catch {
            $tail = ((Get-Content package.log -Tail 30 -ErrorAction SilentlyContinue) + $_.Exception.Message) -join "`n"
            Write-Host ("::error title=package::" + (($tail -replace '%','%25' -replace "`r",'') -replace "`n",'%0A'))
            exit 1
          }

      - name: Install WiX 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.UI.wixext/5.0.2
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension list -g

      - name: Build MSI
        shell: pwsh
        run: |
          try {
            ./packaging/windows/msi/build-msi.ps1 `
              -SourceDir "dist/LADON-$env:VERSION-Setup" `
              -Version "$env:VERSION" `
              -OutDir "dist" *>&1 | Tee-Object -FilePath msi.log
          } catch {
            $tail = ((Get-Content msi.log -Tail 40 -ErrorAction SilentlyContinue) + $_.Exception.Message) -join "`n"
            Write-Host ("::error title=msi::" + (($tail -replace '%','%25' -replace "`r",'') -replace "`n",'%0A'))
            exit 1
          }

      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath dist -File -Filter "LADON-$env:VERSION-*" | Where-Object { $_.Extension -in '.msi', '.zip' } | Sort-Object Name
          $files | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -LiteralPath "dist/SHA256SUMS-$env:VERSION.txt" -Encoding ASCII
          Get-Content -LiteralPath "dist/SHA256SUMS-$env:VERSION.txt"

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $header = "## $env:VERSION "
          $out = @()
          $on = $false
          foreach ($l in (Get-Content -LiteralPath CHANGELOG.md -Encoding UTF8)) {
            if ($l.StartsWith('## ')) {
              if ($on) { break }
              if ($l.StartsWith($header)) { $on = $true; continue }
            }
            if ($on) { $out += $l }
          }
          if ($out.Count -eq 0) { throw "no CHANGELOG section for $env:VERSION" }
          $out | Set-Content -LiteralPath release-notes.md -Encoding UTF8

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" `
            "dist/LADON-$env:VERSION-x64.msi" `
            "dist/LADON-$env:VERSION-Setup.zip" `
            "dist/SHA256SUMS-$env:VERSION.txt" `
            --title "LADON $env:VERSION（试用构建）" `
            --notes-file release-notes.md `
            --prerelease `
            --verify-tag
