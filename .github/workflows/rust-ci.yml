name: Rust core verification
on:
  push:
  pull_request:
jobs:
  fmt:
    # Formatting drift in existing sources must not block the test job; the result is still reported.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - run: cargo generate-lockfile
      - run: cargo test --all-targets --locked
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      # Errors fail the job. Warnings are counted and recorded, not denied.
      - name: Clippy (errors fail, warnings recorded)
        shell: bash
        run: |
          log="${RUNNER_TEMP}/clippy.log"
          cargo clippy --locked --all-targets --message-format=short > "$log" 2>&1
          status=$?
          cat "$log"
          warnings=$(grep -cE '^[^ ]+: warning: ' "$log" || true)
          echo "Clippy printed warning diagnostics: ${warnings}" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - run: cargo generate-lockfile
      - run: cargo test --all-targets --locked
