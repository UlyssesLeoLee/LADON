components:
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://example.invalid/.well-known/openid-configuration
  schemas:
    ApiResponse:
      type: object
      required:
      - request_id
      - status
      properties:
        request_id:
          type: string
        status:
          type: string
        result:
          description: Operation-specific payload; see detailed design
        audit_event_id:
          type: string
        next_cursor:
          type: string
        error:
          $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      properties:
        code:
          type: string
          enum:
          - NOT_FOUND
          - PERMISSION_DENIED
          - SENSITIVE_BLOCKED
          - CONFLICT
          - APPROVAL_REQUIRED
          - CURSOR_EXPIRED
          - RESOURCE_BUSY
          - RATE_LIMITED
          - ARCHIVE_UNVERIFIED
        message:
          type: string
