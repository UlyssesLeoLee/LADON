<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LADON V1.3 · 交互演示</title><style>
:root{color-scheme:light;font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif;--text:#27342c;--muted:#778279;--bg:#f1f3ef;--line:#e5e9e3;--accent:#617b63;--hover:#edf2ec}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#e9ece7;display:grid;place-items:center}.shell{background:#fff;width:min(1500px,98vw);height:min(930px,98vh);border-radius:16px;box-shadow:0 14px 60px #1d2c1e19;border:1px solid #dce1db;display:flex;flex-direction:column;overflow:hidden;color:var(--text)}button{font:inherit;cursor:pointer;border:0;background:transparent;color:inherit}.titlebar{min-height:50px;display:flex;align-items:center;padding:0 22px;gap:13px;border-bottom:1px solid #edf0eb}.logo{color:#698269;font-size:24px}.brand{font-weight:600;font-size:19px}.right{margin-left:auto}.pill{border:1px solid var(--line);padding:8px 14px;border-radius:10px;color:#5b695d}.tabs{display:flex;padding:7px 21px 0;background:#fcfdfc;border-bottom:1px solid var(--line);gap:8px}.tab{padding:12px 22px;border-radius:12px 12px 0 0;color:#7b817e}.tab.active{background:#eff3ed;color:#34513b;border-bottom:2px solid #69876a}.location{display:flex;gap:13px;padding:13px 21px;align-items:center;border-bottom:1px solid var(--line)}.crumb,.search{border:1px solid var(--line);border-radius:10px;padding:10px 15px;background:#fdfdfc}.crumb{flex:1}.search{width:33%;color:var(--muted)}.workspace{display:flex;min-height:0;flex:1}.sidebar{width:238px;flex:0 0 238px;background:#f8faf7;border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .18s ease,flex-basis .18s ease;overflow:visible;position:relative}.sidebar.collapsed{width:62px;flex-basis:62px}.navitems{padding:17px 11px}.navitem{display:flex;align-items:center;height:46px;gap:18px;border-radius:11px;white-space:nowrap;position:relative;color:#5f6d61;width:100%;text-align:left}.navitem.active{background:#e8eee5;color:#375b3e}.icon{display:inline-grid;place-items:center;width:35px;flex:0 0 35px;font-size:19px}.sidebar.collapsed .navlabel{display:none}.sidebar .collapse-toggle{margin-top:auto;margin-bottom:16px;margin-left:16px;align-self:flex-start}.flyout{display:none;position:absolute;left:58px;top:0;min-width:175px;padding:14px 18px;border:1px solid #dfe6dd;background:#fff;box-shadow:0 10px 36px #293b2b1d;border-radius:12px;z-index:20;white-space:normal}.sidebar.collapsed .navitem:hover .flyout,.sidebar.collapsed .navitem:focus-within .flyout{display:block}.flyout div{margin-top:9px;font-size:12px}.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.toolbar{display:flex;gap:6px;align-items:center;padding:13px 19px;border-bottom:1px solid var(--line)}.toolbar button{padding:8px 10px;white-space:nowrap;font-size:13px}.toolbar .new{background:#71896c;color:white;padding:8px 15px;border-radius:9px}.toolbar .grow{margin-left:auto}.listhead,.filerow{display:grid;grid-template-columns:minmax(200px,2fr) minmax(100px,1fr) minmax(60px,.8fr) 78px 96px;gap:12px;align-items:center;padding:0 22px;min-width:0}.listhead{height:42px;color:#8b948d;font-size:12px}.filerow{height:49px;font-size:13px;border-top:1px solid #eff1ed;position:relative}.filerow:hover,.filerow.selected{background:var(--hover)}.filename{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.filerow .quick{position:absolute;right:13px;top:10px;opacity:0;background:#eef4ec;border:1px solid #dce7d9;border-radius:7px;padding:5px 7px}.filerow:hover .quick,.filerow:focus-within .quick{opacity:1}.state{color:#678468}.content{flex:1;overflow:auto;padding-bottom:8px}.dock{margin:0 12px 10px;border:1px solid #dae2d7;border-radius:12px;background:#fafbf9;z-index:8}.dockrow{min-height:50px;display:flex;gap:9px;align-items:center;padding:7px 10px}.dock button,.dock select{border:1px solid #dfe7db;border-radius:9px;padding:8px 10px;background:#f1f4ee;font-size:12px}.dock input{min-width:80px;flex:1;border:0;outline:0;background:transparent;font:inherit;padding:8px}.dock .send{background:#698469;color:white;border:0;min-width:40px}.status{font-size:11px;color:#838e86;white-space:nowrap;transition:opacity 1.7s ease}.status.faded{opacity:0}.status.critical{opacity:1!important;color:#ab643b;font-weight:600}.chatHistory{display:none;border-bottom:1px solid #dfe5dd;min-height:170px;max-height:42vh;overflow:auto;padding:18px 22px}.chatHistory.open{display:block}.chatHistory .msg{font-size:13px;margin:9px 0;padding:10px 12px;background:#eef2ec;border-radius:9px;width:fit-content}.chatTabs{display:flex;gap:15px}.chatTabs button.active{color:#587658;font-weight:600}.popover,.ctx{position:absolute;display:none;z-index:30;background:white;border:1px solid #dce3d9;box-shadow:0 10px 32px #26392925;border-radius:12px;padding:10px;min-width:220px}.popover.open,.ctx.open{display:block}.popover button,.ctx button{display:block;text-align:left;width:100%;padding:10px 12px;font-size:13px;border-radius:7px}.popover button:hover,.ctx button:hover{background:#eef3ec}.ctx{min-width:225px}.ctx hr{border:0;border-top:1px solid var(--line)}.ctx .sensitive{background:#f0f6ee;color:#44634b;font-weight:600}.toast{display:none;position:absolute;bottom:76px;right:18px;background:#f8fcf7;border:1px solid #cbdccb;padding:12px 17px;border-radius:12px;color:#426048;z-index:35}.toast.show{display:block}button:focus-visible,.navitem:focus-visible{outline:2px solid #7eab80;outline-offset:2px}@media(max-width:970px){.listhead,.filerow{grid-template-columns:minmax(160px,2fr) minmax(100px,1fr) 95px}.listhead>:nth-child(3),.listhead>:nth-child(4),.filerow>:nth-child(3),.filerow>:nth-child(4){display:none}.search{width:25%}}@media(max-width:680px){.sidebar{width:62px;flex-basis:62px}.sidebar .navlabel{display:none}.listhead,.filerow{grid-template-columns:minmax(120px,1fr) 100px}.listhead>:nth-child(2),.filerow>:nth-child(2){display:none}.brand{font-size:15px}.toolbar button:nth-child(n+4){display:none}.status{display:none}}
</style></head><body><div class="shell" id="shell"><div class="titlebar"><span class="logo">◆</span><span class="brand">LADON Explorer</span><div class="right"><button class="pill" id="tenantButton">个人空间 / LADON Team ▾</button></div><button title="通知">♧</button><span style="padding-left:12px;color:#888">—　□　×</span></div><div class="tabs"><button class="tab active">▣ 文件浏览</button><button class="tab">▤ 文档任务</button><button class="tab">＋</button></div><div class="location"><span style="color:#929b91">←　→　↑</span><div class="crumb">此电脑　›　项目　›　LADON　›　设计文档</div><div class="search">⌕ 搜索文件、标签、历史…</div></div><div class="workspace"><aside class="sidebar" id="sidebar"><nav class="navitems" id="nav"><button class="navitem"><span class="icon">☆</span><span class="navlabel">快速访问</span></button><button class="navitem active"><span class="icon">▱</span><span class="navlabel">文件浏览</span></button><button class="navitem"><span class="icon">⌕</span><span class="navlabel">搜索</span></button><button class="navitem" id="navtask"><span class="icon">☷</span><span class="navlabel">文档任务</span><div class="flyout">文档任务<div>• 要件条款</div><div>• 影响分析</div><div>• 待审批任务</div></div></button><button class="navitem"><span class="icon">◇</span><span class="navlabel">FileSpace</span></button><button class="navitem"><span class="icon">♧</span><span class="navlabel">云端存储</span></button><button class="navitem"><span class="icon">◷</span><span class="navlabel">完整历史</span></button><button class="navitem"><span class="icon">⊘</span><span class="navlabel">LADON Ignore</span></button></nav><button class="collapse-toggle" id="collapse" title="折叠/展开侧栏 (Ctrl+B)">‹ 折叠</button></aside><main class="main" id="main"><div class="toolbar"><button class="new">＋ 新建</button><button>复制</button><button>分享</button><button>文档任务 ▾</button><button>✧ AI 标签 ▾</button><button id="historyBtn">◷ 历史</button><button>···</button><button class="grow" id="cloudBtn">♧ 已同步 ▾</button></div><div class="content" id="content"><div class="listhead"><span>名称</span><span>修改时间</span><span>类型</span><span>大小</span><span>状态</span></div><div id="files"></div></div><div class="dock"><section class="chatHistory" id="chat"><div class="chatTabs"><button class="active" data-chat="AI">✧ AI 助手</button><button data-chat="团队">♧ 团队通信</button></div><div class="msg">AI：检测到 REQ-027 的设计变更，建议检查相关测试。</div><div class="msg">成员：我已把实施方案关联到要件条款。</div><div class="msg">AI：这是审阅建议，不会自动修改文件。</div></section><div class="dockrow"><button id="chatToggle" title="展开/收起聊天记录">⌃</button><span class="status" id="status">6 项　·　已同步　·　0 个冲突</span><button id="notice" style="display:none">⚠ 未归档历史</button><button>✧ AI ▾</button><button>团队 ▾</button><input id="composer" placeholder="向 AI 或成员发送消息…" aria-label="聊天输入"><button>＠</button><button>↗</button><button class="send" id="send">➤</button></div></div><div class="toast" id="toast"></div><div class="ctx" id="ctx"><button>打开</button><button>在新标签中打开</button><hr><button>剪切　 Ctrl+X</button><button>复制　 Ctrl+C</button><button>重命名　 F2</button><button>删除</button><hr><button>查看完整修改历史</button><button>转成文档任务</button><button>AI 批量标签</button><button class="sensitive" id="sensitive">⊕ 添加为敏感文件</button><hr><button>属性</button><button>显示更多 Windows 经典菜单 ▶</button></div><div class="popover" id="tenant"><button>✓ 个人空间</button><button>研发团队 · 管理员</button><button>＋ 新建工作空间</button><button>成员与设备管理</button></div><div class="popover" id="cloud"><button>Google Drive　✓ 已连接</button><button>NAS　未连接</button><button>归档规则与配额</button></div></main></div></div><script>
const $=s=>document.querySelector(s),side=$('#sidebar'),status=$('#status'),toast=$('#toast');
const showToast=text=>{toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3500)};
const data=[['▱','要件定义.md','2026-11-18 17:36','Markdown','124 KB','已归档'],['▱','基本设计.md','2026-11-18 16:12','Markdown','89 KB','已归档'],['▱','详细设计.md','2026-11-18 15:52','Markdown','198 KB','已同步'],['▣','UT测试计划.xlsx','2026-11-18 15:13','Excel','286 KB','已同步'],['▱','architecture.nema','2026-11-18 14:38','NEMA','18 KB','已归档'],['▣','.LADONignore','2026-11-18 14:05','规则文件','1 KB','仅本地']];
$('#files').innerHTML=data.map((f,i)=>`<div class="filerow" tabindex="0" data-index="${i}"><span class="filename"><span style="color:#69876a;font-size:18px;margin-right:12px">${f[0]}</span>${f[1]}</span><span style="color:var(--muted)">${f[2]}</span><span>${f[3]}</span><span>${f[4]}</span><span class="state">● ${f[5]}</span><button class="quick" title="文件快捷操作" aria-label="打开文件操作菜单">···</button></div>`).join('');
const setSidebar=()=>{side.classList.toggle('collapsed');$('#collapse').textContent=side.classList.contains('collapsed')?'› 展开':'‹ 折叠'};
$('#collapse').onclick=setSidebar;document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='b'){e.preventDefault();setSidebar()}if(e.key==='Escape'){$('#ctx').classList.remove('open');$('#tenant').classList.remove('open');$('#cloud').classList.remove('open')}});
$('#chatToggle').onclick=()=>{const open=$('#chat').classList.toggle('open');$('#chatToggle').textContent=open?'⌄':'⌃'};
$('.chatTabs').addEventListener('click',e=>{if(e.target.matches('button')){document.querySelectorAll('.chatTabs button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active')}});
$('#send').onclick=()=>{const value=$('#composer').value.trim();if(value){showToast('原型演示：未连接真实聊天服务');$('#composer').value=''}};
let selected=0;const ctx=$('#ctx');const showCtx=(x,y)=>{ctx.style.left=Math.max(10,Math.min(x,$('#main').clientWidth-248))+'px';ctx.style.top=Math.max(0,Math.min(y,$('#main').clientHeight-450))+'px';ctx.classList.add('open')};
$('#files').addEventListener('contextmenu',e=>{const row=e.target.closest('.filerow');if(row){e.preventDefault();selected=Number(row.dataset.index);const r=$('#main').getBoundingClientRect();showCtx(e.clientX-r.left,e.clientY-r.top)}});
$('#files').addEventListener('click',e=>{const row=e.target.closest('.filerow');if(row){selected=Number(row.dataset.index);document.querySelectorAll('.filerow').forEach(n=>n.classList.toggle('selected',n===row));if(e.target.classList.contains('quick')){const r=$('#main').getBoundingClientRect();showCtx(e.clientX-r.left,e.clientY-r.top)}}});
$('#sensitive').onclick=()=>{ctx.classList.remove('open');showToast('演示：'+data[selected][1]+' → 加入 .LADONignore（仅原型）')};
const pop=(name,btn)=>{const el=$(name);const rect=$(btn).getBoundingClientRect(),parent=$('#main').getBoundingClientRect();el.style.right=(parent.right-rect.right)+'px';el.style.top=(rect.bottom-parent.top+6)+'px';el.classList.toggle('open')};$('#tenantButton').onclick=()=>pop('#tenant','#tenantButton');$('#cloudBtn').onclick=()=>pop('#cloud','#cloudBtn');
let idle;const activity=()=>{status.classList.remove('faded');clearTimeout(idle);idle=setTimeout(()=>status.classList.add('faded'),4000)};['mousemove','keydown','click'].forEach(ev=>$('#shell').addEventListener(ev,activity,{passive:true}));activity();$('#historyBtn').onclick=()=>showToast('选择文件后显示完整版本历史（本状态为交互演示）');
</script></body></html>
