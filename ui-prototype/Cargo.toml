[package]
name = "ladon-ui-prototype"
version = "0.0.4"
edition = "2021"
license = "AGPL-3.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ladon-gui"
path = "src/main.rs"
required-features = ["kernel", "gui"]

[[test]]
name = "it_slice_a"
path = "tests/it_slice_a.rs"
required-features = ["kernel"]

[features]
default = ["kernel", "gui"]
kernel = ["dep:ladon-explorer", "dep:tokio"]
gui = ["dep:slint"]

[dependencies]
anyhow = "1"
chrono = "0.4"
similar = "2"
ladon-explorer = { path = "..", optional = true }
slint = { version = "1.19", optional = true }
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "sync"], optional = true }

[[test]]
name = "it_settings"
path = "tests/it_settings.rs"
required-features = ["kernel"]

[[test]]
name = "it_archive_nas"
path = "tests/it_archive_nas.rs"
required-features = ["kernel"]

[dev-dependencies]
tempfile = "3"
i-slint-backend-testing = "=1.19.0"

[workspace]
